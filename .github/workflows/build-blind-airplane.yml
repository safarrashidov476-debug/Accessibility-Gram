name: Build Blind Airplane Game

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'blind_shooter_game/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'blind_shooter_game/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install edge-tts

    - name: Grant execute permission for gradlew
      run: chmod +x ./blind_shooter_game/gradlew

    - name: Generate voice prompts
      working-directory: ./blind_shooter_game
      run: python generate_audio.py

    - name: Download Real SFX
      working-directory: ./blind_shooter_game
      run: bash download_real_sfx.sh

    - name: Build with Gradle
      working-directory: ./blind_shooter_game
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: blind-airplane-game-apk
        path: blind_shooter_game/app/build/outputs/apk/debug/app-debug.apk
